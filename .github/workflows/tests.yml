name: Tests

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt pytest numpy gguf tomlkit
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run tests
        run: python scripts/run_checks.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            artifacts/unit-tests.xml
            artifacts/test-identity.json

  wheel-native:
    name: Native Python wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install the official CPU wheel
        run: python -m pip install --only-binary=llama-cpp-python llama-cpp-python==0.3.36 --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu -r requirements.txt
      - name: Verify native sampling and multimodal interfaces
        run: python scripts/wheel_native_check.py
